<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Type Master - Typing Speed Test</title>
    <link rel="stylesheet" href="Day62ofLearning.css">
</head>
<body>
    <div class="container">
        <header>
        <h1>⌨️ TYPE MASTER</h1>
        <p>Test Your Typing Speed!</p>
    </header>
    <hr>
    <br>

    <p class="type">YOUR TYPING TEST</p>
    <br>

    <p>Type the following Sentence:</p>
    <br><br>
    <p id="textToType">"JavaScript makes websites interactive and powerful."</p>
    <br><br>

    <textarea rows="4" cols="4" id="userInput"  disabled  placeholder="Start Typing Here.."></textarea>
    <br><br>
<div class="starts-container">
    <p id="timer">Time</p> 
    <p id="wpm">WPM</p>
    <p id="accuracy">ACCURACY</p>
    <p id="mistakes">MISTAKES</p>
</div>
<div class="buttons">
    <button id="startBtn">START TEST</button>
    <br><br>
    <button id="restartBtn">RESTART</button>
</div>
<footer>
    <p>© 2026 K. Yashavanth | Type Master</p>
</footer>
    </div>

<script src="Day62ofLearning.js"></script>
</body>
</html>
