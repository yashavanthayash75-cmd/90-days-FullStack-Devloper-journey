<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Day60ofLearning.css">
</head>
<body>
    <div class="container">
        <header>
        <h1>Course Progress Tracker</h1>
        <p>Track your Learning</p>
    </header>
    <hr>
    <br>

    <h2 class="addcourse">➕ ADD COURSE</h2>
 <br>
    <label for="courseName">Course Name</label><br>
    <input type="text" id="courseName" placeholder="Enter Course Name">
 <br><br>
    <label for="totallessons">Total Lessons</label><br>
    <input type="number" id="totallessons" placeholder="Enter Total Lessons">
 <br><br>
    <button id="courseBtn">Add Course</button>
 <br><br>
 <hr>
    <h2>My Courses</h2>
<br>
<div id="coursecontainer">
    <p id="card">Course Card :</p>
    <p id="Name">Course Name  :</p>
    <p id="total">Total Lessons :</p>
    <p id="completed">Completed Lessons :</p>
    <p id="ProgressBar">Progress Bar :</p>
    <button id="deleteBtn">DELETE</button>
</div>
<br><br>
<hr>
<h2>Overall Progress</h2><br>
<p id="percentage">Completion Percentage :</p>
<p id="OverallBar">progress Bar :</p>
 </div>
    <script src="Day60ofLearning.js"></script>
</body>
</html>
