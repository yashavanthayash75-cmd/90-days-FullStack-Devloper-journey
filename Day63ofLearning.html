<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>smart unit converter</title>
</head>
<link rel="stylesheet" href="Day63ofLearning.css">
<body>
   <div class="container">
            <header>
        <h1>Smart Unit Converter</h1>
        <p>Convert units easily!</p>
    </header>
    <hr>
    <br>
    <label for="userValue">Enter Value:</label><br>
    <input type="number" id="userValue" placeholder="Enter a number">
    <br><br>  
    <label for="converstionType">choose Converstion:</label><br>
    <select id="converstionType">
        <option value="celsius">Celsius to Fahrenhit</option>
        <option value="kilometers">Kilometers to Miles</option>
        <option value="kilograms">Kilograms to Pounds</option>
    </select>
    <br><br>
    <button id="convertBtn">Convert Now</button>
<br><br>
<hr>
<br>

<div class="result">
     <h2>Converstion Result</h2>
</div>
<br><br>

<p class="results" id="result">Your result will appear here!</p>
