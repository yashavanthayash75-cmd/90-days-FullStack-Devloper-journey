
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country Explorer</title>
    <link rel="stylesheet" href="Day65ofLearning.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>🌍 COUNTRY EXPLORER</h1>
            <p>Explore countries around the world</p>
        </header>

        <hr>

        <div class="search">
            <h2>🔍 Search Countries</h2>
        </div>

        <input type="text" id="search" placeholder="Search Country Name...">

        <br><br>

        <label for="regionfilter">Filter By Region:</label>

        <br><br>

        <select id="regionfilter">
            <option value="all">All Regions</option>
            <option value="Africa">Africa</option>
            <option value="Americas">Americas</option>
            <option value="Asia">Asia</option>
            <option value="Europe">Europe</option>
            <option value="Oceania">Oceania</option>
        </select>

        <br><br>

        <hr>

        <div class="Explore">
            <h2>Explore Countries 🌍</h2>
        </div>

        <div class="cards" id="countryContainer">
            <p>Loading Countries...</p>
        </div>

        <br>

        <hr>

        <section id="CountryDetails">

            <div class="Details">
                <h2>Country Details 🌍</h2>
            </div>

            <div id="detailsContent">
                <p>Select a country to view its details.</p>
            </div>

        </section>

        <br>

        <footer>
            © 2026 K. Yashavanth | Country Explorer
            <br>
            Day 65 of Developer
        </footer>

    </div>

    <script src="Day65ofLearning.js"></script>

</body>
</html>
